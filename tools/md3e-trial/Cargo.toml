[package]
name = "md3e-trial"
version = "0.1.0"
edition = "2024"
description = "A window for trying AntiWebUI's Material 3 Expressive widgets"
license = "MIT OR Apache-2.0"
publish = false

# The AntiWebUI submodule MinkaShell, MinkaMon and MinkaSyu build against,
# so the widgets here are the ones those apps have.
[dependencies]
anti-webui = { path = "../../AntiWebUI/src/anti-webui", default-features = false, features = ["wayland", "svg"] }
anti-webui-md3e = { path = "../../AntiWebUI/src/anti-webui-md3e" }
# MinkaDE's palette (generated from Proustite.qml), shared by every app.
proustite = { path = "../../Proustite" }
