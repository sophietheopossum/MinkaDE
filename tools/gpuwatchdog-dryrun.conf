# Trial mode for gpuwatchdog.service.
#
# Install as /etc/systemd/system/gpuwatchdog.service.d/dryrun.conf while the
# thresholds are still being judged against real behaviour. The watchdog still
# polls, still captures to /var/log/gpuwatchdog and still raises notifications;
# it just never signals. Delete the drop-in and restart to arm it.
#
# Only the mode is set here: the unit's ExecStart expands $GPUWATCHDOG_MODE
# into its own argument, so the targets are stated once, in the unit.
[Service]
Environment=GPUWATCHDOG_MODE=--dry-run
